name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'assets/**'
      - 'vendor/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the offline website
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html style.css app.js android/app/src/main/assets/www/
          cp -R assets android/app/src/main/assets/www/
          mkdir -p android/app/src/main/assets/www/vendor
          cp -R vendor/three android/app/src/main/assets/www/vendor/
          cp vendor/mediapipe/gesture_recognizer.task android/app/src/main/assets/gesture_recognizer.task
      - name: Build APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Check bundled files
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www/index.html'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www/assets/model.jpg'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www/assets/background.aac'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/gesture_recognizer.task'
      - uses: actions/upload-artifact@v4
        with:
          name: GestureParticles-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GestureParticles-Android-v1.0.4.apk
          if gh release view android-v1.0.4 >/dev/null 2>&1; then
            echo 'Release android-v1.0.4 already exists; keeping its signed APK unchanged.'
          else
            gh release create android-v1.0.4 GestureParticles-Android-v1.0.4.apk \
              --title '手势粒子照片 Android v1.0.4' \
              --notes '手机版默认完整展示照片，控制台改为底部弹出面板，摄像头预览缩为底部小窗。保留安卓原生手势识别、离线照片与背景音。'
          fi
